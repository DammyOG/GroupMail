<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gmail Group</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <h1>Group Mail</h1>
    <div id="message"></div>
    <div id="job-options" class="options" style="display:none">
        <label for="scope">Scope</label>
        <select id="scope"></select>
        <label for="limit">Go back</label>
        <span class="limit-field">
            <input id="limit" type="number" min="1" step="10" />
            <span>emails</span>
        </span>
    </div>
    <div class="container">
        <button id="sign-in">Sign-in</button>
        <button id="sign-out" style="display:none">Sign-out</button>
        <button id="group-emails" style="display:none">Group Emails</button>
        <button id="clear-labels" style="display:none">Clear Labels</button>
        <button id="clear-all" style="display:none">Clear All</button>
        <button id="settings">Settings</button>
    </div>
    <script type="module" src="popup.js"></script>
</body>
</html>
